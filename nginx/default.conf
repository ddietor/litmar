# Configuración del servidor nginx que sirve la web y reenvía la API.
# Se monta como solo lectura en /etc/nginx/conf.d/default.conf (ver compose.yaml).

server {
    listen 80;
    # nginx escucha en el puerto 80 del contenedor (compose lo publica como 8080).

    server_name _;
    # Acepta cualquier nombre de host: en local llegamos por IP/puerto.

    root /usr/share/nginx/html;
    # Directorio de ficheros estáticos: el montaje de src/litmar/web de compose.

    index index.html;
    # Al pedir "/", nginx sirve index.html.

    location ~ ^/(salud|fuentes|buscar|revisiones|docs|openapi\.json) {
        # Rutas de la API. El patrón cubre las cuatro rutas del contrato más
        # /docs y /openapi.json (Swagger necesita ambas). Todo lo demás es web.

        proxy_pass http://api:8000;
        # `api` es el nombre del servicio en compose: Docker lo resuelve por DNS.
        # Sin barra final al final de la URL, nginx pasa la URI tal cual.

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Conservan el host y la IP originales por si la API los necesitara.

        proxy_connect_timeout 30s;
        # Tiempo máximo para establecer la conexión con la API.

        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
        # 10 minutos para enviar y para esperar la respuesta. Una revisión tarda
        # minutos: con el valor por defecto de nginx (60 s) daría 504.
    }

    location / {
        try_files $uri $uri/ /index.html;
        # Si el fichero existe se sirve; si no, se devuelve index.html.
        # Así "/" muestra la web y las rutas relativas siguen funcionando.
    }
}
